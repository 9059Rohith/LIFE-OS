services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: lifeos
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos -d lifeos"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  lifeos:
    build: .
    env_file: .env
    environment:
      LIFEOS_DATABASE_URL: postgresql+psycopg://lifeos:${POSTGRES_PASSWORD}@database:5432/lifeos
      LIFEOS_STATIC_DIR: /app/frontend/dist
    ports:
      - "127.0.0.1:${LIFEOS_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - application_data:/app/data
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  postgres_data:
  application_data:
