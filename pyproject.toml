[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "lifeos"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.135.1", "uvicorn[standard]==0.42.0", "sqlalchemy==2.0.48", "pydantic-settings==2.14.2", "cryptography==50.0.1", "httpx==0.28.1", "python-multipart==0.0.32", "psycopg[binary]==3.3.3", "alembic==1.18.4"]
[project.optional-dependencies]
dev = ["pytest==9.0.3", "pytest-asyncio==1.3.0", "ruff==0.15.6", "pip-audit==2.10.0", "playwright==1.58.0", "mypy==1.19.1"]
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
target-version = "py311"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
