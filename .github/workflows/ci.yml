name: Verify LIFEOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python scripts/run_lifeos_evals.py
      - run: python -m ruff check backend tests scripts
      - run: python -m mypy --strict backend/lifeos/policy.py backend/lifeos/schemas.py backend/lifeos/config.py
      - run: python -m pytest -q
      - run: python scripts/scan_secrets.py
      - run: python -m pip_audit
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm ci --ignore-scripts && npm test && npm audit --audit-level=high
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
      - run: docker build -t lifeos:verified .
      - name: Verify PostgreSQL container workflow
        run: |
          cp .env.example .env
          sed -i 's/^LIFEOS_MODE=.*/LIFEOS_MODE=demo/' .env
          export POSTGRES_PASSWORD="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          trap 'docker compose -p lifeos-ci down' EXIT
          docker compose -p lifeos-ci up --build -d --wait --wait-timeout 90
          python scripts/benchmark.py --url http://127.0.0.1:8000 --runs 2 --output /tmp/benchmark-postgres.json

  desktop-installer:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run dist:win
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: lifeos-windows-companion-unsigned
          path: artifacts/windows/LIFEOS-Desktop-*.exe
          if-no-files-found: error
