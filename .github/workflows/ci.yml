name: Verify LIFEOS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install '.[dev]'
      - run: python -m ruff check backend tests scripts
      - run: python -m mypy --strict backend/lifeos/policy.py backend/lifeos/schemas.py backend/lifeos/config.py
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
      - run: python scripts/scan_secrets.py
      - run: python -m pip_audit
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start demo API for browser tests
        run: |
          LIFEOS_MODE=demo LIFEOS_ENVIRONMENT=test LIFEOS_DATABASE_URL=sqlite:///./data/ci.db \
            python -m uvicorn lifeos.main:app --host 127.0.0.1 --port 8010 > /tmp/lifeos-ci.log 2>&1 &
          python scripts/wait_for_api.py --url http://127.0.0.1:8010/ready
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
      - name: API logs
        if: failure()
        run: cat /tmp/lifeos-ci.log 2>/dev/null || true
      - run: docker build -t lifeos:verified .
      - name: Verify PostgreSQL container workflow
        run: |
          cp .env.example .env
          export POSTGRES_PASSWORD="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          trap 'docker compose -p lifeos-ci down' EXIT
          docker compose -p lifeos-ci up --build -d --wait --wait-timeout 90
          python scripts/benchmark.py --url http://127.0.0.1:8000 --runs 2 --output /tmp/benchmark-postgres.json
      # No publication credentials or automatic deployment. Release procedure:
      # docs/DEPLOYMENT.md. A deployment must consume a successful verify run.
