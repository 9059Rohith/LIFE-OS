services:
  - type: web
    name: lifeos
    env: docker
    plan: free
    # Render will automatically use the Dockerfile in the repository root.
    envVars:
      - key: PORT
        value: 8000
      - key: LIFEOS_MODE
        value: live
      - key: LIFEOS_ENVIRONMENT
        value: production
      - key: LIFEOS_USER_REGISTRATION
        value: "false"
      - key: LIFEOS_DATABASE_URL
        # Set this manually in the Render dashboard using your Supabase connection string.
        sync: false
      - key: LIFEOS_AUTH_PASSWORD
        # Set this manually in the Render dashboard (16+ characters).
        sync: false
      - key: LIFEOS_ENCRYPTION_KEY
        # Set this manually in the Render dashboard (e.g. `openssl rand -base64 32`).
        sync: false
      - key: LIFEOS_ALLOWED_ORIGINS
        # Set this manually in the Render dashboard to the exact HTTPS Render/custom domain.
        sync: false
      - key: LIFEOS_GOOGLE_REDIRECT_URI
        # Set this manually to https://<your-domain>/api/integrations/google/callback.
        sync: false
